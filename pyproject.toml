[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonlens"
version = "0.1.0"
description = "Traceable cloud-emissions screening and human-reviewed recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
    "hypothesis==6.170.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"carbonlens.emissions" = ["registry.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src", "app.py", "tests"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ui: Streamlit dashboard interaction tests; no browser or live API required"]